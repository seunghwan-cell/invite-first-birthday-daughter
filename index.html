<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>최이현의 첫돌 초대장</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0eae1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .invitation-wrapper {
            width: 100%;
            max-width: 480px;
            background-color: #ffffff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        .invitation-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

<div class="invitation-wrapper">
    <!-- 1. 아기 초대장 사진 -->
    <img src="1000053316.jpg" alt="최이현 돌잔치 초대장">
    
    <!-- 2. 주차 및 이용 안내 사진 -->
    <img src="1000053923.jpg" alt="주차 및 오시는 길 안내">
</div>

</body>
</html>
